name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Run ruff check
        run: uv run --frozen ruff check
      - name: Run ruff format check
        run: uv run --frozen ruff format --check
      - name: Run tests
        run: uv run --frozen pytest
