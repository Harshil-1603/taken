name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run ruff check
        run: uv run --frozen ruff check
      - name: Run ruff format check
        run: uv run --frozen ruff format --check
      - name: Run tests
        run: uv run --frozen pytest -n auto --cov=taken --cov-report=term-missing
      - name: Run mypy
        run: uv run --frozen mypy taken/

  smoke:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Build wheel
        run: uv build
      - name: Install wheel into a fresh venv
        run: |
          uv venv /tmp/smoke-venv
          uv pip install --python /tmp/smoke-venv/bin/python dist/*.whl
      - name: Smoke test the installed entry point
        run: |
          BIN=/tmp/smoke-venv/bin/taken
          $BIN --version
          $BIN --help
          set +e
          $BIN not-a-target >/dev/null 2>&1
          code=$?
          set -e
          test "$code" -eq 3
      - name: Smoke test taken-mcp without the mcp extra
        run: |
          set +e
          /tmp/smoke-venv/bin/taken-mcp 2>/tmp/taken-mcp-err.txt
          code=$?
          set -e
          test "$code" -eq 2
          grep -q 'taken-gh\[mcp\]' /tmp/taken-mcp-err.txt
