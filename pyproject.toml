[project]
name = "taken"
version = "0.1.0"
description = "Check whether a GitHub issue is already taken before you volunteer for it."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "RogueAlg0" }]
keywords = ["github", "cli", "open-source"]

[project.scripts]
taken = "taken.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
